spring.application.name=petServices
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastros_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiracao-minutos=120

# primeiro admin, criado so quando a tabela tb_admin esta vazia
admin-inicial.email=${ADMIN_EMAIL:}
admin-inicial.senha=${ADMIN_SENHA:}

# depois de 5 logins errados o IP fica bloqueado por 15 minutos
login.max-falhas=5
login.bloqueio-minutos=15

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000

spring.kafka.consumer.group-id=petservices-cadastros
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.petServices.*
